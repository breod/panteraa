<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Faça seu Cadastro</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: linear-gradient(#8B0000, #4A0000);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .home {
      position: absolute;
      top: 25px;
      left: 30px;
      color: white;
      font-weight: bold;
    }

    .container {
      background: rgba(139, 0, 0, 0.95);
      width: 380px;
      padding: 45px 35px;
      border-radius: 22px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
      text-align: center;
      color: white;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 35px;
      letter-spacing: 1px;
    }

    .campo {
      margin-bottom: 22px;
      text-align: left;
    }

    label {
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      height: 52px;
      background: #f0f0f0;
      border-radius: 8px;
      border: none;
    }

    .buttons {
      display: flex;
      gap: 15px;
      margin-top: 35px;
    }

    button {
      flex: 1;
      padding: 13px;
      border: none;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: scale(1.05);
    }

    .cancelar {
      background: #e0e0e0;
      color: #333;
    }

    .cadastrar {
      background: white;
      color: #8B0000;
    }
  </style>
</head>
<body>

  <div class="home">HOME</div>

  <div class="container">
    <h1>FAÇA SEU CADASTRO</h1>
    
    <div class="campo">
      <label>Login</label>
      <input type="text" disabled>
    </div>

    <div class="campo">
      <label>Senha</label>
      <input type="password" disabled>
    </div>

    <div class="campo">
      <label>Nome</label>
      <input type="text" disabled>
    </div>

    <div class="campo">
      <label>Email</label>
      <input type="email" disabled>
    </div>

    <div class="buttons">
      <button class="cancelar">CANCELAR</button>
      <button class="cadastrar">CADASTRAR</button>
    </div>
  </div>

</body>
</html>
