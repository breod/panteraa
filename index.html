<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login</title>

  <style>
    *{
      margin: 10px;
      padding: 15px;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    body{
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(to bottom, #4d0000, #b30000, #660000);
    }
    .container{
      width: 400px;
      padding: 40px;
      border-radius: 30px;
      background: rgb(120, 0, 0, 0.7);
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
      text-align: center;
    }
    h1{
      color: white;
      margin-bottom: 40px;
      font-size: 35px;
    }
    .input-box{
      margin-bottom: 20px;
    }
    input{
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 30px;
      outline: none;
      font-size: 16px;
    }
    .botoes{
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
    }
    button{
      width: 50%;
      padding: 15px;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover{
      transform: scale(1.05);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>FAÇA SEU LOGIN</h1>
    <div class="input-box">
      <input type="text" placeholder="Login">
    </div>
    <div class="input-box">
      <input type="password" placeholder="Senha">
    </div>
    <div class="botoes">
      <button>CADASTRAR</button>
      <button>LOGAR</button>
    </div>
  </div>
</body>
</html>
